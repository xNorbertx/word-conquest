name: Android APK
on:
  push:
    branches-ignore: [gh-pages]
    paths-ignore: ['docs/**', '**/*.md', 'design/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    # Standard runner in this public repository. Do not switch to a paid larger runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WC_ANDROID_KEYSTORE: /tmp/word-conquest-pilot.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: Public app configuration and stable pilot signing
        env:
          WC_PUBLIC_CONFIG: ${{ secrets.WC_PUBLIC_CONFIG }}
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          node --input-type=commonjs <<'NODE'
          const fs=require('node:fs');
          if(!process.env.WC_PUBLIC_CONFIG || !process.env.ANDROID_DEBUG_KEYSTORE)throw Error('Android build configuration missing');
          fs.writeFileSync('online/config.local.js',process.env.WC_PUBLIC_CONFIG);
          fs.writeFileSync(process.env.WC_ANDROID_KEYSTORE,Buffer.from(process.env.ANDROID_DEBUG_KEYSTORE,'base64'),{mode:0o600});
          NODE
          cert=$(keytool -exportcert -keystore "$WC_ANDROID_KEYSTORE" -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f1)
          echo "Configured signing certificate SHA-256: $cert"
          test "$cert" = "306e097ad7c8d10fe0a5829e4e49420de84ac258e5056f9583447bdcc944c266"
      - run: npm run build
      - name: Configure Android and Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          node scripts/prepare-android.cjs
          npx cap sync android
      - name: Compile APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug --console=plain
      - name: Verify signing and package artifact
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          cert=$("$signer" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
          echo "APK signing certificate SHA-256: $cert"
          test "$cert" = "306e097ad7c8d10fe0a5829e4e49420de84ac258e5056f9583447bdcc944c266"
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/word-conquest-android.apk
          cp dist/android-build.json apk/build.json
          sha256sum apk/word-conquest-android.apk > apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: word-conquest-android-${{ github.run_number }}-${{ github.sha }}
          path: apk/
          retention-days: 7
